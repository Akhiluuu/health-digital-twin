version: '3.8'

services:
  redis:
    image: redis:alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: twins_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    command: uvicorn biogears_service.api.server:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-password}@db:5432/twins_db
      - CELERY_ALWAYS_EAGER=False
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  celery_worker:
    build: .
    restart: unless-stopped
    command: celery -A biogears_service.api.tasks.celery_app worker --loglevel=info
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-password}@db:5432/twins_db
      - CELERY_ALWAYS_EAGER=False
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G

  # ── Medication Vault Service ──────────────────────────────────────────────
  medication_api:
    build:
      context: .
      dockerfile: medication_service/Dockerfile
    restart: unless-stopped
    command: uvicorn medication_service.api.app:app --host 0.0.0.0 --port 8001 --workers 2
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-password}@db:5432/twins_db
      - REDIS_URL=redis://redis:6379/1
      - SERVER_BASE_URL=http://web:8000
      - DIGITAL_TWIN_API_KEY=${DIGITAL_TWIN_API_KEY:-changeme}
      - ALLOW_DEV_AUTH=false
      - ALLOWED_ORIGINS=*
      - FIREBASE_ADMIN_CREDENTIALS=/app/firebase_admin.json
    volumes:
      - ./firebase_admin.json:/app/firebase_admin.json:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  medication_worker:
    build:
      context: .
      dockerfile: medication_service/Dockerfile
    restart: unless-stopped
    command: >
      celery -A medication_service.workers.celery_workers.celery_app
      worker --loglevel=info --beat --scheduler celery.beat.PersistentScheduler
      --queues medication
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-password}@db:5432/twins_db
      - REDIS_URL=redis://redis:6379/1
      - SERVER_BASE_URL=http://web:8000
      - DIGITAL_TWIN_API_KEY=${DIGITAL_TWIN_API_KEY:-changeme}
      - FIREBASE_ADMIN_CREDENTIALS=/app/firebase_admin.json
    volumes:
      - ./firebase_admin.json:/app/firebase_admin.json:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      medication_api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

volumes:
  postgres_data:
