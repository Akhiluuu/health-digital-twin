name: VitalHealth AI Production Release Gate

on:
  push:
    branches: [ develop, release/* ]
  pull_request:
    branches: [ main, develop ]

jobs:
  ai-acceptance-gate:
    name: Clinical AI Acceptance & Release Gate Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System & Python Dependencies
        run: |
          python -m pip install --upgrade pip
          # Install all project dependencies from requirements.txt, excluding
          # llama-cpp-python (large binary that requires C++ compilation — not
          # needed for the rule-based acceptance gate) and heavy DB drivers.
          grep -v -E "^llama-cpp-python|^psycopg2-binary|^asyncpg|^firebase-admin|^celery|^redis" requirements.txt > /tmp/ci_requirements.txt
          pip install -r /tmp/ci_requirements.txt

      - name: Execute Production Release Gate Test Suite
        run: |
          chmod +x ./scripts/run_production_gate.sh
          ./scripts/run_production_gate.sh

      - name: Upload AI Acceptance Reports Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-acceptance-reports
          path: |
            healthbot_v4/ai_acceptance/reports/
            healthbot_v4/ai_acceptance/failures/
