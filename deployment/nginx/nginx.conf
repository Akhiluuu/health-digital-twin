# VitalHealth v5.0 Production Nginx Configuration
user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    worker_connections 8192;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Structured JSON Logging Format for Production Centralized Log Scraper
    log_format json_combined escape=json
      '{"time_local":"$time_local",'
      '"remote_addr":"$remote_addr",'
      '"remote_user":"$remote_user",'
      '"request":"$request",'
      '"status": "$status",'
      '"body_bytes_sent":"$body_bytes_sent",'
      '"request_time":"$request_time",'
      '"http_referrer":"$http_referer",'
      '"http_user_agent":"$http_user_agent",'
      '"upstream_response_time":"$upstream_response_time",'
      '"upstream_connect_time":"$upstream_connect_time"}';

    access_log /var/log/nginx/access.log json_combined;
    error_log /var/log/nginx/error.log warn;

    # Performance Tuning & High Concurrency
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 10000;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip & Brotli Compression Settings
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Strict Production Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Rate Limiting & Concurrency Zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=addr_limit:10m;

    # Upstream Microservice Load Balancing Pools
    upstream health_brain_backend {
        server web:8000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream medication_vault_backend {
        server medication_api:8001 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    # HTTP Server Block — Redirect all traffic to HTTPS (Health Check Exception)
    server {
        listen 80;
        listen [::]:80;
        server_name api.vitalhealth.app localhost;

        location /health {
            access_log off;
            return 200 '{"status":"UP","node":"nginx-proxy"}';
            add_header Content-Type application/json;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS Production TLS Server Block
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name api.vitalhealth.app localhost;

        # SSL Certificates
        ssl_certificate /etc/nginx/ssl/live/api.vitalhealth.app/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/api.vitalhealth.app/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Max Payload Upload (OCR PDF Scans & Medical Records up to 50MB)
        client_max_body_size 50M;
        client_body_buffer_size 128k;

        # Health Brain Gateway Route (REST API + AI LLM Streaming + WebSockets)
        location / {
            limit_req zone=api_limit burst=100 nodelay;
            limit_conn addr_limit 50;

            proxy_pass http://health_brain_backend;
            proxy_http_version 1.1;
            
            # WebSocket & SSE Streaming headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Streaming & Buffer Tuning for Real-Time AI Generation
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 300s;
        }

        # Medication Vault Route
        location /medications/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://medication_vault_backend/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Developer Telemetry & Operations Dashboard
        location /dev/ {
            proxy_pass http://health_brain_backend/dev/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
