# /etc/nginx/sites-available/digitaltwin
# Routes:
#   http://VM_IP/        → BioGears Simulation API  (localhost:8000)
#   http://VM_IP/ai/     → Health AI Dr. Aria        (localhost:8001)

# ── BioGears Simulation API ───────────────────────────────────────────────────
server {
    listen 80;
    server_name _;

    # BioGears simulations run 10–25 minutes — generous timeouts
    proxy_read_timeout    1800s;
    proxy_connect_timeout   30s;
    proxy_send_timeout     300s;

    client_max_body_size 200M;

    # ── BioGears API (all routes except /ai/) ────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "";
        proxy_buffering    off;
        proxy_cache        off;
    }

    # ── Health AI — Dr. Aria Chatbot ─────────────────────────────────────────
    # Mobile app accesses: http://VM_IP/ai/generate, /ai/health, etc.
    # Nginx strips the /ai prefix before forwarding to port 8001.
    location /ai/ {
        proxy_pass         http://127.0.0.1:8001/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "";
        # Disable buffering — LLM responses stream token by token
        proxy_buffering    off;
        proxy_cache        off;
        # LLM generation can take up to 5 minutes on CPU-only VMs
        proxy_read_timeout 300s;
    }

    # ── Medication Vault API ──────────────────────────────────────────────────
    # Mobile app accesses: http://VM_IP/medication/api/v1/medication/...
    location /medication/ {
        proxy_pass         http://127.0.0.1:8002/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "";
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 120s;
        client_max_body_size 25M;
    }

    # ── Simulation HTML reports ───────────────────────────────────────────────
    location /view-reports/ {
        alias   {{PROJECT_DIR}}/reports/;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff"      always;
    add_header X-Frame-Options        "DENY"          always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Referrer-Policy        "no-referrer"   always;

    # ── Logging ───────────────────────────────────────────────────────────────
    access_log /var/log/nginx/digitaltwin_access.log;
    error_log  /var/log/nginx/digitaltwin_error.log warn;
}
