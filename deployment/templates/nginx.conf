# /etc/nginx/sites-available/digitaltwin
# Routes:
#   HTTPS://VM_IP/        → BioGears Simulation API  (localhost:8000)
#   HTTPS://VM_IP/ai/     → Health AI Personal Health Assistant  (localhost:8001)
#   HTTPS://VM_IP/medication/ → Medication Vault      (localhost:8002)

# Rate limiting zone definition for API endpoints
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=15r/s;

# ── BioGears Simulation HTTP Server (Port 80) ─────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # BioGears simulations run 10–25 minutes — generous timeouts
    proxy_read_timeout    1800s;
    proxy_connect_timeout   30s;
    proxy_send_timeout     300s;

    client_max_body_size 200M;

    # ── Gzip Compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # ── BioGears API (all routes except /ai/) ────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "";
        proxy_buffering    off;
        proxy_cache        off;
    }

    # ── Health AI — Personal Health Assistant ─────────────────────────────────
    location /ai/ {
        proxy_pass         http://127.0.0.1:8001/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "";
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
    }

    # ── Medication Vault API ──────────────────────────────────────────────────
    location /medication/ {
        proxy_pass         http://127.0.0.1:8002/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "";
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 120s;
        client_max_body_size 25M;
    }

    # ── Simulation HTML reports ───────────────────────────────────────────────
    location /view-reports/ {
        alias   {{PROJECT_DIR}}/reports/;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        add_header X-Content-Type-Options "nosniff"      always;
        add_header X-Frame-Options        "DENY"          always;
        add_header Referrer-Policy        "no-referrer"   always;
    }

    # ── Logging ───────────────────────────────────────────────────────────────
    access_log /var/log/nginx/digitaltwin_access.log;
    error_log  /var/log/nginx/digitaltwin_error.log warn;
}
