# /etc/nginx/sites-available/digitaltwin
# Routes:
#   HTTPS://VM_IP/        → BioGears Simulation API  (localhost:8000)
#   HTTPS://VM_IP/ai/     → Health AI Dr. Aria        (localhost:8001)
#   HTTPS://VM_IP/medication/ → Medication Vault      (localhost:8002)

# Rate limiting zone definition for API endpoints
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=15r/s;

# ── Redirect HTTP (Port 80) to HTTPS ──────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── BioGears Simulation HTTPS Server (Port 443) ───────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # SSL Certificate Configuration (Configure with Certbot / self-signed certificate)
    # ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    # Hardened TLS Protocols and Cipher Suites (Mozilla Modern/Intermediate)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';

    # SSL Sessions and Cache optimization
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # BioGears simulations run 10–25 minutes — generous timeouts
    proxy_read_timeout    1800s;
    proxy_connect_timeout   30s;
    proxy_send_timeout     300s;

    client_max_body_size 200M;

    # Apply rate limiting to all requests
    limit_req zone=api_limit burst=30 nodelay;

    # ── Gzip Compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # ── BioGears API (all routes except /ai/) ────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "";
        proxy_buffering    off;
        proxy_cache        off;
    }

    # ── Health AI — Dr. Aria Chatbot ─────────────────────────────────────────
    location /ai/ {
        proxy_pass         http://127.0.0.1:8001/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "";
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
    }

    # ── Medication Vault API ──────────────────────────────────────────────────
    location /medication/ {
        proxy_pass         http://127.0.0.1:8002/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "";
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 120s;
        client_max_body_size 25M;
    }

    # ── Simulation HTML reports ───────────────────────────────────────────────
    location /view-reports/ {
        alias   {{PROJECT_DIR}}/reports/;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        add_header X-Content-Type-Options "nosniff"      always;
        add_header X-Frame-Options        "DENY"          always;
        add_header Referrer-Policy        "no-referrer"   always;
    }

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff"      always;
    add_header X-Frame-Options        "DENY"          always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Referrer-Policy        "no-referrer"   always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:; font-src 'self' data: https:; connect-src 'self' https:;" always;

    # ── Logging ───────────────────────────────────────────────────────────────
    access_log /var/log/nginx/digitaltwin_access.log;
    error_log  /var/log/nginx/digitaltwin_error.log warn;
}
